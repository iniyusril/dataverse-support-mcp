[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataverse-support-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent (e.g. Hermes) triage and answer support emails stored in Microsoft Dynamics 365 / Dataverse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "dynamics-365", "dataverse", "customer-support", "ai-agent", "hermes"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
  "msal>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dataverse-support-mcp = "dataverse_support_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataverse_support_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
